<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>점곡 한글 왕국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 블록 장난감 느낌: 진한 남색 테두리 + 아래로 두꺼운 그림자, 단계마다 고유한 색 */
:root{
  --ink:#1b2340; --paper:#fffdf5; --sun:#ffc824; --grass:#4fbf4a; --hot:#ff4f6e; --muted:#5d6685;
  --display:"Jua","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,table,td,th,h1,h2,b{font-family:var(--display);font-weight:400}
html,body{height:100%;margin:0;background:#8fd8ff;overflow:hidden;font-family:var(--display);font-weight:400;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:var(--display);font-weight:400;color:var(--ink);cursor:pointer;border:3px solid var(--ink);background:#fff;border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:9px 14px;font-size:17px;transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.go{background:var(--sun);font-size:22px;padding:12px 26px}
button:disabled{opacity:.45;cursor:default}

/* 꾸미기 */
#avatar{position:fixed;top:0;right:0;bottom:0;width:min(440px,56vw);background:var(--paper);border-left:5px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;z-index:20}
#avatar h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;letter-spacing:-.5px}
#avatar h1 b{font-weight:400;color:#e8384f}
#avatar p{margin:0;font-size:15px;color:var(--muted)}
.row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
.row>label,.row>span{font-family:var(--display);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;font-size:15px;box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:9px}
.chip.on{background:var(--sun)}
.sw{width:32px;height:32px;padding:0;border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--hot);outline-offset:1px}
#ver{font-size:13px;color:var(--muted);margin-top:auto}
#nick{font-family:var(--display);font-size:18px;border:3px solid var(--ink);border-radius:10px;padding:7px 10px;width:100%;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.av-foot{display:flex;gap:8px;padding-top:6px;align-items:center;flex-wrap:wrap}
.av-foot .go{flex:1}
@media (max-width:640px){#avatar{width:100%;top:38vh;border-left:0;border-top:5px solid var(--ink)}#avatar h1{font-size:30px}}

/* 게임 화면 위 표시 */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#steps{position:absolute;left:10px;top:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;max-width:min(330px,58vw);box-shadow:0 4px 0 var(--ink)}
#stepchips{display:flex;gap:4px;margin-bottom:5px}
.st{flex:1;min-width:28px;height:26px;border-radius:7px;border:2px solid var(--ink);display:grid;place-items:center;font:15px var(--display);background:#d9dce6;color:#7a8097}
.st.now{background:var(--sun);color:var(--ink);animation:pulse 1s infinite alternate}
.st.done{color:#fff}
@keyframes pulse{to{transform:translateY(-2px)}}
#goal{font-size:14.5px;line-height:1.3}
#topr{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#topr button{font-size:15px;padding:6px 10px}
#net{font:14px var(--display);background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;align-self:center}
#net.on{background:#16883c}
#compass{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px}
#arrow{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:34px solid var(--hot);filter:drop-shadow(0 3px 0 var(--ink))}
#dist{font:14px var(--display);background:#fffc;border-radius:7px;padding:1px 7px;white-space:nowrap}
@media (max-width:760px){#compass{top:96px;left:60px}#net{display:none}}
#stick{position:absolute;left:24px;bottom:24px;width:128px;height:128px;border-radius:50%;background:#1b234055;border:3px solid #fff8;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#fffd;border:3px solid var(--ink)}
#acts{position:absolute;right:18px;bottom:20px;display:flex;gap:10px;align-items:flex-end}
#acts button{touch-action:none;border-radius:50%}
#bL{width:94px;height:94px;font-size:42px;padding:0;background:#b9ff3c}
#bL.on{background:var(--hot);color:#fff}
#bL.locked{background:#8d92a6;color:#e4e6ee;border-style:dashed;box-shadow:none;font-size:26px;line-height:1}
#bLn{display:block;font-size:15px;line-height:1.15}
#bJ{width:78px;height:78px;font-size:19px;padding:0;background:#7fd0ff}
#bC{width:68px;height:68px;font-size:15px;padding:0;white-space:nowrap}
#bHear{width:78px;height:78px;font-size:30px;padding:0;background:#fff3b0;animation:pulse .7s infinite alternate}
#chat{position:absolute;right:18px;bottom:190px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
#chat button{font-size:15px;padding:6px 11px;background:var(--paper)}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:14px;background:#1b2340cc;color:#fff;padding:5px 12px;border-radius:9px;white-space:nowrap}
@media (max-width:900px),(pointer:coarse){#hint{display:none}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:#fff;font:21px var(--display);padding:10px 20px;border-radius:12px;text-align:center;max-width:86vw;opacity:0;transition:opacity .2s;box-shadow:0 5px 0 #0006}
#toast.on{opacity:1}

/* 카드와 문제 */
.veil{position:fixed;inset:0;background:#1b234099;display:grid;place-items:center;z-index:30;padding:12px}
.panel{background:var(--paper);border:5px solid var(--ink);border-radius:20px;padding:18px 22px;width:min(560px,100%);max-height:96%;overflow-y:auto;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
.panel p{margin:0;font-size:19px;line-height:1.45}
.tag{align-self:flex-start;font:15px var(--display);padding:3px 10px;border-radius:8px;color:#fff;border:2px solid var(--ink)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.qpanel{width:min(640px,100%)}
#qShow{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#qShow:empty{display:none}
.qpic{font-size:96px;line-height:1.05;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.qbig{font:62px var(--display);background:#fff;border:4px solid var(--ink);border-radius:16px;padding:2px 24px;box-shadow:0 4px 0 var(--ink);letter-spacing:2px}
.qhear{font-size:21px;background:#7fd0ff}
.qhear.big{font-size:30px;padding:18px 30px;border-radius:18px}
#qChoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.tile{font-size:42px;min-height:86px;padding:8px 6px;line-height:1.1}
.tile.pic{font-size:58px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tile.no{background:#ffc9d2;opacity:.55}
.tile.yes{background:#a8f0ae;opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#qinfo{font-size:19px;min-height:26px;color:#a8213c;text-align:center}
#qinfo.good{color:#0e7a37}
#gamebox .panel{width:min(780px,100%);padding:10px 14px;gap:6px}
#gamebox h2{font-size:24px}
#gc{width:100%;aspect-ratio:720/420;background:#000;border:3px solid var(--ink);border-radius:10px;touch-action:none;display:block}
#gdom{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 0;border:3px solid var(--ink);border-radius:10px;background:#fff8e6}
.bprog{font-size:17px;color:var(--muted)}
.bpic{font-size:80px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bword{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bt{min-width:86px;height:86px;padding:0 8px;border:4px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;font:54px var(--display);box-shadow:0 4px 0 var(--ink)}
.bt.q{background:#fff3b0;border-style:dashed}
.bt.ok{background:#a8f0ae}
.bt small{font-size:34px}
.bpal{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}
.blab{font-size:17px;color:var(--muted);min-width:40px;text-align:right}
.bo{font-size:38px;min-width:72px;min-height:68px;padding:4px 12px}
.bo.on{background:var(--sun)}
.bo.used{opacity:.25}
#gsay{font-size:17px;min-height:24px;line-height:1.3;flex:1}
#gamebox .bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
#gNext{white-space:nowrap;font-size:19px}
#gHear{white-space:nowrap;background:#7fd0ff;font-size:17px}
#book table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.3}
#book td,#book th{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:middle}
#book th{font-family:var(--display);font-weight:400;background:#ffe9a3}
#book .gn{font-family:var(--display);font-size:17px;color:#fff;white-space:nowrap}
#book .stars{font-size:20px;color:#e0a000;white-space:nowrap}
#book td button{font-size:15px;padding:5px 9px}
#fail{position:fixed;inset:0;display:none;place-items:center;background:var(--paper);padding:24px;z-index:99;font-size:20px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="steps"><div id="stepchips"></div><div id="goal"></div></div>
  <div id="compass"><div id="arrow"></div><div id="dist"></div></div>
  <div id="topr">
    <span id="net">연결 중</span>
    <button id="bBook">한글 수첩</button>
    <button id="bSnd">소리 끄기</button>
    <button id="bLook">꾸미기</button>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <div id="chat" class="hide"></div>
  <div id="acts">
    <button id="bHear" class="hide" aria-label="소리 다시 듣기">🔊</button>
    <button id="bC">말하기</button>
    <button id="bJ">점프</button>
    <button id="bL">L<span id="bLn"></span></button>
  </div>
  <div id="hint">방향키나 W A S D로 걷기, 스페이스 점프, 화면을 끌면 시점 돌리기</div>
  <div id="toast"></div>
</div>

<div id="avatar" class="hide">
  <h1>점곡 <b>한글</b> 왕국</h1>
  <p>나만의 캐릭터를 꾸미고 한글 왕국으로 들어가 봅시다. 찬찬한글 1~6단원에서 배운 것을 다시 익혀 봅시다.</p>
  <div class="row"><label for="nick">별명</label><input id="nick" maxlength="8" placeholder="진짜 이름은 쓰지 않아요" autocomplete="off"></div>
  <div id="opts"></div>
  <div id="ver">11월 16일 1번째 판</div>
  <div class="av-foot">
    <button id="bRand">아무거나</button>
    <button id="bReset" class="hide">새로 시작</button>
    <button id="bEnter" class="go">왕국으로 들어가기</button>
  </div>
</div>

<div id="card" class="veil hide"><div class="panel">
  <span class="tag" id="cTag"></span>
  <h2 id="cTitle"></h2>
  <p id="cText"></p>
  <div class="acts"><button id="cBtn" class="go"></button></div>
</div></div>

<div id="quiz" class="veil hide"><div class="panel qpanel">
  <span class="tag" id="qTag"></span>
  <h2 id="qText"></h2>
  <div id="qShow"></div>
  <div id="qChoices"></div>
  <div id="qinfo"></div>
  <div class="acts"><button id="qNext" class="go hide">다음</button></div>
</div></div>

<div id="gamebox" class="veil hide"><div class="panel">
  <div class="bar"><h2 id="gTitle"></h2><span class="tag" id="gTag"></span></div>
  <canvas id="gc" width="720" height="420"></canvas>
  <div id="gdom" class="hide"></div>
  <div class="bar"><button id="gHear">🔊 다시 듣기</button><div id="gsay"></div><button id="gNext" class="go hide">문제 풀러 가기</button></div>
</div></div>

<div id="book" class="veil hide"><div class="panel" style="width:min(780px,100%)">
  <h2>한글 수첩</h2>
  <p style="font-size:16px" id="bookNote"></p>
  <div id="bookBody"></div>
  <div class="acts"><button id="bookClose" class="go">닫기</button></div>
</div></div>

<div id="fail"><div>게임을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 다시 열어 봅시다.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
if(!window.THREE){document.getElementById('fail').style.display='grid';throw new Error('three')}
const $=id=>document.getElementById(id);

/* DATA-START */
/* ───────── 학습 내용: 찬찬한글(학생용, 한국교육과정평가원) 1~6단원, 8~139쪽 ───────── */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
const mk=(c,v,j)=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+(j?JONG.indexOf(j):0));
const sp=s=>{const n=s.charCodeAt(0)-0xAC00;return[CHO[Math.floor(n/588)],JUNG[Math.floor(n%588/28)],n%28?JONG[n%28]:'']};
const isSyl=s=>{const n=s.charCodeAt(0);return n>=0xAC00&&n<=0xD7A3};
const VOW=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const vs=v=>mk('ㅇ',v);
const VG=[['ㅏ','ㅑ','ㅓ','ㅕ'],['ㅗ','ㅛ','ㅜ','ㅠ'],['ㅡ','ㅣ','ㅗ','ㅜ'],['ㅏ','ㅓ','ㅗ','ㅜ'],['ㅑ','ㅕ','ㅛ','ㅠ'],['ㅡ','ㅣ','ㅏ','ㅓ']];
/* 2단원 배움 8~12 묶음 */
const CG=[['ㄱ','ㅋ','ㄲ'],['ㄴ','ㄷ','ㅌ','ㄸ'],['ㅁ','ㅂ','ㅍ','ㅃ'],['ㅅ','ㅈ','ㅊ','ㅉ','ㅆ'],['ㅇ','ㅎ','ㄹ']];

/* 소리가 같거나 비슷한 복잡한 모음은 같은 묶음(4단원 82~97쪽) */
const CV={'ㅐ':'e','ㅔ':'e','ㅒ':'ye','ㅖ':'ye','ㅘ':'wa','ㅝ':'wo','ㅙ':'we','ㅞ':'we','ㅚ':'we','ㅟ':'wi','ㅢ':'ui'};
const CVOW=Object.keys(CV);

const VSW={'ㅏ':'ㅓ','ㅓ':'ㅏ','ㅗ':'ㅜ','ㅜ':'ㅗ','ㅑ':'ㅕ','ㅕ':'ㅑ','ㅛ':'ㅠ','ㅠ':'ㅛ','ㅡ':'ㅣ','ㅣ':'ㅡ','ㅐ':'ㅏ','ㅔ':'ㅓ','ㅒ':'ㅑ','ㅖ':'ㅕ','ㅘ':'ㅝ','ㅝ':'ㅘ','ㅙ':'ㅘ','ㅞ':'ㅝ','ㅚ':'ㅗ','ㅟ':'ㅢ','ㅢ':'ㅟ'};
const CSW={'ㄱ':'ㅋ','ㅋ':'ㄲ','ㄲ':'ㄱ','ㄴ':'ㄹ','ㄷ':'ㅌ','ㅌ':'ㄸ','ㄸ':'ㄷ','ㄹ':'ㄴ','ㅁ':'ㅂ','ㅂ':'ㅍ','ㅍ':'ㅃ','ㅃ':'ㅂ','ㅅ':'ㅈ','ㅈ':'ㅊ','ㅊ':'ㅉ','ㅉ':'ㅈ','ㅆ':'ㅅ','ㅇ':'ㅎ','ㅎ':'ㅇ'};
const PIC={아이:'🧒',여우:'🦊',오이:'🥒',우유:'🥛',아기:'👶',
 나무:'🌳',다리:'🦵',파리:'🪰',오리:'🦆',가지:'🍆',고기:'🥩',나비:'🦋',기타:'🎸',바구니:'🧺',코끼리:'🐘',기차:'🚂',버스:'🚌',치즈:'🧀',모기:'🦟',주스:'🧃',스키:'🎿',포도:'🍇',소파:'🛋️',소나무:'🌲',거미:'🕷️',피아노:'🎹',너구리:'🦝',모자:'🧢',지도:'🗺️',파도:'🌊',도자기:'🏺',가수:'🎤',
 개:'🐕',게:'🦀',해:'☀️',배:'🍐',새:'🐦',시계:'⏰',귀:'👂',과자:'🍪',화가:'🎨',돼지:'🐷',뇌:'🧠',외투:'🧥',의자:'🪑',의사:'🧑‍⚕️',바위:'🪨',거위:'🦢',
 야구:'⚾',요리사:'🧑‍🍳',소녀:'👧',사과:'🍎',교과서:'📚',야채:'🥬',추위:'🥶',더위:'🥵',
 곰:'🐻',뱀:'🐍',그림:'🖼️',구름:'☁️',참외:'🍈',접시:'🍽️',수첩:'📒',서랍:'🗄️',입:'👄',집:'🏠',밥:'🍚',상어:'🦈',피망:'🫑',풍선:'🎈',호랑이:'🐯',공:'🏀',왕:'👑',학교:'🏫',수박:'🍉',축구:'⚽',가족:'👪',책:'📕',분수:'⛲',우산:'☂️',기린:'🦒',산:'⛰️',손:'✋',콜라:'🥤',구슬:'🔮',얼굴:'🙂',별:'⭐',달:'🌙',물:'💧',귤:'🍊',돋보기:'🔍',숟가락:'🥄',걷다:'🚶'};
/* 1단원 26쪽 */
const W1=['아이','여우','오이','우유','아기'];

function peersTick(dt,now){
  const pn=performance.now();
  for(const p of [...peers.values()]){
    if(pn-p.seen>5000){drop(p.id);continue}
    const c=p.c,k=Math.min(1,dt*9),rp=c.root.position,dist=Math.hypot(p.x-rp.x,p.z-rp.z);
    rp.x+=(p.x-rp.x)*k;rp.y+=(p.y-rp.y)*k;rp.z+=(p.z-rp.z)*k;
    let dy=p.r-c.root.rotation.y;while(dy>Math.PI)dy-=6.2832;while(dy<-Math.PI)dy+=6.2832;c.root.rotation.y+=dy*k;
    c.state=p.s===0&&dist>.15?1:p.s;
    animate(c,dt,now);
  }
}

/* 낱말 칸 채우기 놀이(글자 공장·무지개·받침) */
function builder(rounds,intro,win){
  const el=$('gdom');let i=0,extra=0,sel=[],lock=false,lastIntro=intro,R=null;
  const draw=done=>{
    let h=`<div class="bprog">${i+1} / ${rounds.length}</div>`;
    if(R.pic)h+=`<div class="bpic">${R.pic}</div>`;
    h+='<div class="bword">';[...R.word].forEach((s,k)=>{h+=k===R.at?`<div class="bt ${done?'ok':'q'}" id="bTarget">${done?s:R.disp(sel)}</div>`:`<div class="bt">${s}</div>`});h+='</div>';
    R.parts.forEach((p,k)=>{h+=`<div class="bpal"><span class="blab">${p.name}</span>`;p.opts.forEach(o=>{h+=`<button class="bo${sel[k]===o?' on':''}" data-k="${k}" data-o="${o}">${o}</button>`});h+='</div>'});
    el.innerHTML=h;el.querySelectorAll('.bo').forEach(b=>b.onclick=()=>choose(+b.dataset.k,b.dataset.o));
  };
  const render=first=>{R=rounds[i];sel=R.parts.map(()=>null);draw();
    const vl=[];if(first)vl.push(intro);else if(R.intro&&R.intro!==lastIntro)vl.push(R.intro);if(R.intro)lastIntro=R.intro;vl.push(...R.say);voice(vl);
    hearFn=()=>voice(R.say);gsay((R.again?'🔁 다시 푸는 문제입니다. ':'')+(R.hint||''));};
  const choose=(k,o)=>{if(lock||!R)return;sel[k]=o;sfx([600],.04);
    if(sel.every(x=>x!==null)){
      if(R.parts.every((p,kk)=>sel[kk]===p.ans)){lock=true;draw(true);sfx([660,880,1175]);voice(R.say);
        let m='맞았습니다!';if(R.wrong&&extra<4&&!R.re){extra++;rounds.push({...R,wrong:0,again:0,re:1});m+=' 한 번 틀렸으니 뒤에 한 번 더 나옵니다.'}gsay(m);
        setTimeout(()=>{lock=false;i++;if(i>=rounds.length){R=null;el.innerHTML='<div class="bpic">🎉</div>';gWin(win)}else render()},1400)}
      else{lock=true;miss();R.wrong=(R.wrong||0)+1;draw();$('bTarget').classList.add('shake');el.querySelectorAll('.bo').forEach(b=>b.disabled=true);sfx([220,170]);
        const combos=R.parts.reduce((a,p)=>a*p.opts.length,1);
        if(R.wrong>=Math.min(2,combos-1)){
          /* 두 번 틀리면(보기가 둘이면 한 번) 이 문제를 맨 뒤로 보낸다 */
          voice([P.back]);gsay('이 문제는 맨 뒤로 보내고 나중에 다시 풀어 봅시다.');
          setTimeout(()=>{lock=false;rounds.splice(i,1);rounds.push({...R,wrong:0,again:1});render()},2600)}
        else{voice([P.again,...R.say]);gsay('틀렸습니다. 다시 들어 보고 천천히 골라 봅시다.');
          setTimeout(()=>{lock=false;sel=R.parts.map(()=>null);draw()},1700)}}
    }else draw();
  };
  render(true);
}
/* 낱말 기차: 글자를 차례대로 누르기 */
function trainGame(words,win){
  const el=$('gdom');let i=0,extra=0,lock=false,R=null;
  const draw=()=>{let h=`<div class="bprog">${i+1} / ${words.length}</div><div class="bpic">${PIC[R.w]}</div><div class="bword">🚂`;
    R.syl.forEach((s,k)=>{h+=`<div class="bt ${k<R.n?'ok':'q'}">${k<R.n?s:''}</div>`});h+='</div><div class="bpal">';
    R.cars.forEach((c,k)=>{h+=`<button class="bo${c.used?' used':''}" data-k="${k}" ${c.used?'disabled':''}>${c.t}</button>`});
    el.innerHTML=h+'</div>';el.querySelectorAll('.bo').forEach(b=>b.onclick=()=>tap(+b.dataset.k,b))};
  const moved=new Set();
  const render=first=>{const w=words[i];const syl=[...w];const ds=new Set();
    shuf(variants(w)).forEach(v=>{[...v].forEach((s,k)=>{if(s!==syl[k]&&ds.size<2&&!syl.includes(s))ds.add(s)})});
    R={w,syl,n:0,wrong:0,cars:shuf([...syl,...ds].map(t=>({t,used:false})))};draw();
    voice(first?[P.g3,w]:[w]);hearFn=()=>voice([w]);gsay((moved.has(w)?'🔁 다시 만드는 낱말입니다. ':'')+'글자를 앞에서부터 차례대로 눌러 봅시다.')};

    tiles.forEach(([x,z],i)=>{const v=(Math.abs(x)+Math.abs(z)+bt*(bt%8<4?1:-1)+700)%pal.length;tileMesh.setColorAt(i,tmpC.set(pal[Math.floor(v)]))});tileMesh.instanceColor.needsUpdate=true}
  ballM.rotation.y=now/900;
  beams.forEach((b,i)=>{if(b.userData.pump){const s=1+Math.abs(Math.sin(now/500*Math.PI))*.09;b.scale.set(s,1,s);return}const a=now/1300+i*1.57;b.rotation.x=Math.cos(a)*.55;b.rotation.z=Math.sin(a)*.55});
  dancers.forEach(c=>animate(c,dt,now));
  platTick(dt,now);
  step(dt,now);animate(me.char,dt,now);peersTick(dt,now);
  if(ui==='play'){zoneTick(dt,now);courseTick(dt,now);netTick(pn)}
  /* 음악: 파티장에 가까울수록 크게, 문제를 풀 때와 목소리가 나올 때는 작게 */
  if(musicGain){const d=Math.hypot(me.x,me.z);musicGain.gain.value=modal||voicing?.03:Math.max(.05,.42-d*.0075)}
  for(let i=parts.length-1;i>=0;i--){const m=parts[i];m.t-=dt;m.v.y-=18*dt;m.position.addScaledVector(m.v,dt);m.rotation.x+=dt*5;if(m.t<=0){scene.remove(m);parts.splice(i,1)}}
  clouds.forEach((c,i)=>{c.position.x+=dt*(.5+i%3*.3);if(c.position.x>180)c.position.x=-180});
  if(ui==='avatar'||ui==='load'){
    me.char.root.rotation.y=Math.sin(now/1600)*.55;
    const wide=innerWidth>640,side=wide?1.75:0;
    const px=me.x,py=me.y+1.6,pz=me.z;
    camPos.set(px+side,py+.3,pz+6.6);look.set(px+side,py-(wide?0:1.4),pz);
    camera.position.lerp(camPos,Math.min(1,dt*6));camera.lookAt(look);
  }else{
    const cp=Math.cos(camPitch),sp2=Math.sin(camPitch);
    look.set(me.x,me.y+2,me.z);
    camPos.set(me.x+Math.sin(camYaw)*cp*camDist,Math.max(.8,me.y+2+sp2*camDist),me.z+Math.cos(camYaw)*cp*camDist);
    camera.position.lerp(camPos,Math.min(1,dt*10));camera.lookAt(look);
  }
  if(activeGame&&activeGame.update){activeGame.update(dt);activeGame.draw()}
  renderer.render(scene,camera);
}

/* ───────── 시작 ───────── */
function boot(){
  buildParty();buildZones();buildCourses();buildScenery();
  me.char=makeChar(S.look,S.name||'나',badgeBits());scene.add(me.char.root);
  camera.position.set(0,5,30);
  resize();openAvatar();
  if(TEST)window.__g={S,me,ZONES,COURSES,platforms,finish,refreshSteps,startGame,startQuiz,startMini,runQs,QUIZ,MINI,voice,save,get activeGame(){return activeGame},setCam(y,p,d){camYaw=y;camPitch=p;camDist=d}};
  frame();
}
const ALLTEXT=[...new Set(document.documentElement.innerHTML.match(/[ㄱ-힣]/g)||[])].join('');
const fontWait=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('40px Jua',ALLTEXT),new Promise(r=>setTimeout(r,5000))]):Promise.resolve();
fontWait.catch(()=>{}).then(boot);
</script>
